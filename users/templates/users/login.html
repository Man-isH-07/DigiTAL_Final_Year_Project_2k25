<!DOCTYPE html>
<html lang="en">

{% load static %}
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User's Login | DigiTAL</title>

  <link rel="icon" href="{% static 'img/redketchup/android-chrome-512x512.png' %}" type="image/icon type">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <!-- fontawesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    * {
      padding: 0;
      margin: 0;
      border: none;
      text-decoration: none;
      letter-spacing: 1px;
      text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black;
    }
    
    .poppins-regular {
  font-family: "Poppins", serif;
  font-weight: 400;
  font-style: normal;
}


    body {
      background-color: grey;
    }

    #hero {
      background-image: url('{% static "img/backgrd.svg" %}');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #hero::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: rgba(0, 0, 0, 0.1);
      z-index: 0;
    }

    .hero-section-container {
      background-color: rgba(255, 255, 255, 0.1);
      height: 90vh;
      width: 56%;
      border-radius: 30px;
      border: 2px solid rgba(211, 211, 211, 0.2);
      backdrop-filter: blur(8px);
    }

    /* Header */
    header {
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    .logo {
      font-size: 40px;
      font-weight: bold;
      color: white;
      text-shadow: -6px 0 black, 0 1px black, 1px 0 black, 0 -1px black;
    }

    .logo span {
      color: rgb(0, 225, 225);
      text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black;
    }

    .login-container {
      width: 30vw;
      margin: 0 auto;
      margin-top: 10px;
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0, 225, 225, 0.5);
      text-align: center;
      backdrop-filter: blur(10px);

    }

    .line
    {
      border-top: 2px solid black;
      width: 25vw;
      margin: 10px;
    }

    .login-container h1{
      color: white;
      text-shadow: -5px 0 black, 0 1px black, 1px 0 black, 0 -1px black;
    }

    .login-container h2 {
      color: rgb(255, 255, 255);
      margin-bottom: 10px;
    }

    .login-container label {
      display: block;
      color: white;
      font-size: 20px;
      text-shadow: -3px 0 black, 0 1px black, 1px 0 black, 0 -1px black;
    }

    .login-container input {
      width: 20vw;
      padding: 8px;
      margin-bottom: 5px;
      border-radius: 5px;
      border: 1px solid rgb(0, 225, 225);
      text-shadow: -1px 0 white, 0 1px white, 1px 0 white, 0 -1px white;
    }

    .login-container .role {  
      width: 10vw; 
      padding: 5px;
    }

    .role select
    {
      padding: 5px;
      font-weight:normal;
    }

    .role select option
    {
      padding: 5px;
      font-weight:normal;
    }


    .check_register {
      margin-bottom: 10px;
      font-size: smaller;
      color: white;
      text-shadow: -2px 0 black, 0 1px black, 1px 0 black, 0 -1px black;

    }

    .check_register a {
      color: white;
      text-decoration: underline;
      text-shadow: -1px 0 blue, 0 1px blue, 1px 0 blue, 0 -1px blue;
      font-weight: normal;

    }

    .login-button {
      padding: 6px 14px;
      border-radius: 5px;
      background-color: rgb(0, 225, 225);
      color: black;
      border: none;
      cursor: pointer;
      height: 6vh;
      width: 6vw;
      font-size: large;
    }

    .login-button:hover {
      background-color: rgb(115, 255, 255);
      color: black;
    }


    .social-icons {
      color: white;
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 3%;
    }

    .social-icons i {
      font-size: 18px;
      width: 10px;
      height: 10px;
      border: 1px solid white;
      padding: 15px;
      border-radius: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .social-icons i:hover {
      color: rgb(0, 225, 225);
      border-color: rgb(0, 225, 225);
      transform: rotate(360deg) scale(1.1);
    }

    /* Hero Section Animation */
    @keyframes sideInLeft {
      from {
        transform: translateX(-100%);
        opacity: 0;
      }

      to {
        transform: translateX(0%);
        opacity: 1;
      }
    }

    @keyframes sideInRight {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0%);
        opacity: 1;
      }
    }

    @keyframes topIn {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }

      to {
        transform: translateY(0%);
        opacity: 1;
      }
    }

    @keyframes bottomIn {
      from {
        transform: translateY(100%);
        opacity: 0;
      }

      to {
        transform: translateY(0%);
        opacity: 1;
      }
    }

    header {
      animation: topIn 1.2s ease-out forwards;
      opacity: 0;
      animation-delay: 0.2s;
    }

    .login-container {
      animation: sideInLeft 1s ease-out forwards;
      opacity: 0;
      animation-delay: 0.8s;
    }

    .social-icons {
      animation: bottomIn 1s ease-out forwards;
      opacity: 0;
      animation-delay: 0.2s;
    }
  </style>

</head>

<body class="poppins-regular">
  <!--Hero section-->
  <section id="hero">
    <div class="hero-section-container">
      <header>
        <a class="logo" href="#hero">Digi<span>TAL</span></a> <!--Left Section-->
      </header>
      <div class="login-container">

        <h1>Login</h1>

        <center><div class="line"></div></center>

        <form method="post">
          {% csrf_token %}
          {% if error %}
          <p style="color: red;">{{ error }}</p>
          {% endif %}

          <label for="username">Username:</label>
          <input type="text" name="username" required><br><br>

          <label for="password">Password:</label>
          <input type="password" name="password" required><br>

          <center>
            <div class="role">
              <label for="role">Role:</label>
              <select name="role" class="poppins-regular" required>
              <option value="user">User</option>
              <option value="doctor">Doctor</option>
              <option value="desk">Desk</option>
              <option value="admin">Admin</option>
            </select>
            </div>
          </center>
          <br>

          <hr>

          <p class="check_register">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>

          <br>

          <button type="submit" class="login-button">Login</button>
        </form>
        
      </div>


      <div class="social-icons">
        <i class="fa-brands fa-facebook"></i>
        <i class="fa-brands fa-youtube"></i>
        <i class="fa-brands fa-twitter"></i>
        <i class="fa-brands fa-google"></i>
      </div>

    </div>
  </section>


</body>

</html>
