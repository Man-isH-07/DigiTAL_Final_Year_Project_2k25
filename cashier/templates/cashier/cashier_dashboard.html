<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier Dashboard | DigiTAL</title>

    <link rel="icon" href="{% static 'img/redketchup/android-chrome-512x512.png' %}" type="image/icon type">

    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

    <!-- fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Same styles as user_dashboard.html */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Fredoka", sans-serif;
        }

        body {
            background: url("{% static 'img/backgrd.svg' %}") no-repeat center center fixed;
            background-size: cover;
        }

        .hero-section-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
        }

        .logo span {
            color: #00c4cc;
        }

        .logoutBtn a {
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            padding: 10px 20px;
            border: 2px solid #00c4cc;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .logoutBtn a:hover {
            background: #00c4cc;
        }

        .title {
            font-size: 3rem;
            color: #fff;
            text-align: center;
            margin-bottom: 40px;
        }

        .options-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .option-box {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(211, 211, 211, 0.2);
            backdrop-filter: blur(8px);
            border-radius: 15px;
            padding: 20px;
            width: 300px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .option-box:hover {
            transform: translateY(-10px);
        }

        .option-box h2 {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 10px;
        }

        .option-box p {
            font-size: 1rem;
            color: #d3d3d3;
        }

        form {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00c4cc;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        form select, form textarea {
            padding: 10px;
            font-size: 1rem;
            border: 2px solid #00c4cc;
            border-radius: 5px;
            background: #fff;
        }

        form textarea {
            height: 100px;
            resize: none;
        }

        form button {
            padding: 10px;
            font-size: 1rem;
            border: none;
            background: #00c4cc;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        form button:hover {
            background: #0099a6;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        ul li {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(211, 211, 211, 0.2);
            border-radius: 10px;
            padding: 10px;
            margin: 10px 0;
            color: #fff;
        }
    </style>
</head>

<body>
    <section id="hero">
        <div class="hero-section-container">
            <header>
                <a class="logo" href="{% url 'cashier_dashboard' %}">Digi<span>TAL</span></a>
                <span class="logoutBtn"><a href="{% url 'logout' %}">Logout</a></span>
            </header>

            <div class="user-page">
                <h1 class="title">Cashier Dashboard</h1>
                <div class="options-container">
                    <div class="option-box">
                        <h2>Add Pharmacy Bill</h2>
                        <form id="pharmacy-bill-form">
                            <select name="patient_id" required>
                                <option value="">Select Patient</option>
                                {% for patient in patients %}
                                    <option value="{{ patient.id }}">{{ patient.name }}</option>
                                {% endfor %}
                            </select>
                            <textarea name="bill_data" placeholder="Enter bill details" required></textarea>
                            <button type="submit">Add Pharmacy Bill</button>
                        </form>
                    </div>
                </div>

                <h2 style="color: #fff; text-align: center; margin: 20px 0;">Pharmacy Bills</h2>
                <ul>
                    {% for bill in bills %}
                        <li>{{ bill.patient.name }} - {{ bill.bill_data }} - {{ bill.created_at }}</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#pharmacy-bill-form').on('submit', function(e) {
                e.preventDefault();
                const patientId = $('select[name="patient_id"]').val();
                const billData = $('textarea[name="bill_data"]').val();
                $.ajax({
                    url: '{% url "add_pharmacy_bill" %}',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        patient_id: patientId,
                        bill_data: billData
                    }),
                    success: function(response) {
                        alert(response.message);
                        location.reload();
                    },
                    error: function(xhr) {
                        const error = xhr.responseJSON ? xhr.responseJSON.error : 'Unknown error';
                        alert('Error: ' + error);
                    }
                });
            });
        });
    </script>
</body>
</html>
