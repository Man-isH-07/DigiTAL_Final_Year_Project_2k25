<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <title>Manual Booking | DigiTAL</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            border: none;
            text-decoration: none;
            font-family: "Fredoka", sans-serif;
            letter-spacing: 1px;
        }

        .poppins-regular {
            font-family: "Poppins", serif;
            font-weight: 400;
            font-style: normal;
        }

        body {
            background-image: url('{% static "img/backgrd.svg" %}');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;


        }


        #hero {

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #hero::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.1);
            z-index: 0;
        }

        .hero-section-container {
            background-color: rgba(255, 255, 255, 0.1);
            height: fit-content;
            width: 60vw;
            border-radius: 30px;
            border: 2px solid rgba(211, 211, 211, 0.2);
            backdrop-filter: blur(8px);
            padding: 10px;
            margin-top: 15px;

        }

        /* Header */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            justify-content: space-between;
            padding: 5px 15px;
            margin: 20px;
            z-index: 1;
        }

        .back_btn {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 6px 14px;
            border-radius: 5px;
            background-color: rgb(0, 225, 225);
            color: black;
            border: none;
            cursor: pointer;
            height: fit-content;
            width: fit-content;
            font-size: large;
        }

        .back_btn:hover {
            background-color: rgb(115, 255, 255);
            color: black;
            font-weight: bold;
        }

        .back_btn a{
            color: black;
        }

        .logo {
            font-size: 40px;
            font-weight: bold;
            color: white;
            text-shadow: -6px 0 black, 0 1px black, 1px 0 black, 0 -1px black;
        }

        .logo span {
            color: rgb(0, 225, 225);
            text-shadow: -6px 0 black, 0 1px black, 1px 0 black, 0 -1px black;
        }

        .add_pat {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 6px 14px;
            margin-top: 20px;
            border-radius: 5px;
            background-color: rgb(0, 225, 225);
            color: black;
            border: none;
            cursor: pointer;
            height: fit-content;
            width: fit-content;
            font-size: large;
        }

        .add_pat:hover {
            background-color: rgb(115, 255, 255);
            color: black;
            font-weight: bold;
        }

        #video {
            width: 200px;
            /* Set a fixed width */
            height: 150px;
            /* Set a fixed height */
            border: 2px solid #ccc;
            /* Optional: Add a border for aesthetics */
            border-radius: 10px;
            /* Optional: Rounded corners */
            object-fit: cover;
            /* Ensures the aspect ratio is maintained */
        }

        #canvas {
            display: none;
            /* Initially hide the canvas */
            width: 200px;
            /* Match the size of the video */
            height: 150px;
            border: 2px solid #ccc;
            border-radius: 10px;
        }

        .add-patient-form {
            background-color: transparent;
            border: 1px solid black;
            border-radius: 20px;
            padding: 10px;
            color: white;
            font-size: 18px;
            text-shadow: -3px 0 black, 0 1px black, 1px 0 black, 0 -1px black;
        }

        .add-patient-form h3 {
            margin-bottom: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .group {
            display: flex;
            justify-content: space-around;
        }

        form label {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: small;
            font-weight: 400;
        }

        form input,
        form select,
        form textarea {
            width: 30%;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-weight: 500;
        }


        .title {
            font-size: 2.5rem;
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black;
        }

        /* Container for the animated boxes */
        .options-container {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            flex-wrap: wrap;
            margin: 15px;
        }

        /* Styling each option box */
        .option-box {
            width: 300px;
            height: 150px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .option-box h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .option-box p {
            color: #555;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        /* Buttons inside the option boxes */
        .option-box .btn {
            padding: 10px 20px;
            background-color: white;
            color: black;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }

        .option-box .btn:hover {
            background-color: white;
        }

        /* Hover animations for boxes */
        .option-box:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }


        /* Hero Section Animation */
        @keyframes sideInLeft {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }

            to {
                transform: translateX(0%);
                opacity: 1;
            }
        }

        @keyframes sideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0%);
                opacity: 1;
            }
        }

        @keyframes topIn {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }

            to {
                transform: translateY(0%);
                opacity: 1;
            }
        }

        @keyframes bottomIn {
            from {
                transform: translateY(100%);
                opacity: 0;
            }

            to {
                transform: translateY(0%);
                opacity: 1;
            }
        }

        header {
            animation: topIn 1.2s ease-out forwards;
            opacity: 0;
            animation-delay: 0.2s;
        }
    </style>
</head>

<body>

    <body class="poppins-regular">
        <!--Hero section-->
        <section id="hero">
            <div class="hero-section-container">
                <header>
                    <a class="logo" href="#hero">Digi<span>TAL</span></a> <!--Left Section-->
                    <button type="submit" class="back_btn"><a href="{% url 'user_dashboard' %}">Back</a></button>
                </header>
                <div class="login-container">

                    <div class="add-patient-form">
                        <h3>Manual Booking</h3>
                        <h3>---------------------------</h3>
                        {% if messages %}
                        <ul>
                            {% for message in messages %}
                            <center>
                                <li style="color: white; background-color: green; padding: 5px; border: none; 
                            border-radius: 10px; width: fit-content; list-style: none; margin: 10px;">{{ message }}</li>
                            </center>
                            {% endfor %}
                        </ul>
                        
                        {% endif %}
                        <form method="post">
                            {% csrf_token %}
                            <div class="group">
                                <select name="doctor_id" id="doctor-select" required>
                                    <option value="">Select a Doctor</option>
                                    {% for doctor in doctors %}
                                    <option value="{{ doctor.id }}" data-slots="{{ doctor.available_slots }}">
                                        {{ doctor.name }} ({{ doctor.specialization }})
                                    </option>
                                    {% endfor %}
                                </select>
                                <input type="date" name="date" required>
                                <select name="time" id="time-select" required>
                                    <option value="">Select a Time Slot</option>
                                </select>
                            </div>
                            <div class="group">
                                <input type="text" name="name" placeholder="Enter Name" required>
                                <input type="number" name="age" placeholder="Enter Age" required>
                            </div>

                            <div class="group">
                                <input type="tel" name="contact" placeholder="Enter Phone No." required>
                                <input type="email" name="email" placeholder="Enter Email">
                            </div>

                            <div class="group">
                                <select name="gender" required>
                                    <option value="unknown">Select Gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                </select>

                                <select name="blood_grp" required>
                                    <option value="unknown">Select Blood Group</option>
                                    <option value="a+">A+</option>
                                    <option value="a-">A-</option>
                                    <option value="b+">B+</option>
                                    <option value="b-">B-</option>
                                    <option value="o+">O+</option>
                                    <option value="o-">O-</option>
                                </select>
                            </div>

                            <!-- Live Photo Capture -->
                            <div class="group">
                                <textarea name="symptoms" rows="2" placeholder="Enter Symptoms"></textarea>
                                <video id="video" autoplay></video>
                                <button id="captureButton" type="button">Capture Photo</button>
                                <canvas id="canvas" style="display:none;"></canvas>
                                <input type="hidden" name="photo" id="photo">
                            </div>

                            <div class="group">
                                <button type="submit" class="add_pat">Book Appointment</button>    
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <script>
            document.getElementById("doctor-select").addEventListener("change", function () {
                let selectedDoctor = this.options[this.selectedIndex];
                let availableSlots = selectedDoctor.getAttribute("data-slots").split(",");

                let timeSelect = document.getElementById("time-select");
                timeSelect.innerHTML = ""; // Clear previous options

                if (availableSlots.length > 0) {
                    availableSlots.forEach(function (slot) {
                        let option = document.createElement("option");
                        option.value = slot;
                        option.textContent = slot;  // Display 24-hour format
                        timeSelect.appendChild(option);
                    });
                } else {
                    let option = document.createElement("option");
                    option.textContent = "No slots available";
                    timeSelect.appendChild(option);
                }
            });
            // Access the video element, canvas, and hidden input
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const photoInput = document.getElementById('photo');
            const captureButton = document.getElementById('captureButton');
            let stream;

            // Access the webcam
            navigator.mediaDevices.getUserMedia({ video: true })
                .then((mediaStream) => {
                    stream = mediaStream;
                    video.srcObject = stream;
                })
                .catch((error) => {
                    console.error('Error accessing the camera:', error);
                    alert('Unable to access camera. Please check your device permissions.');
                });

            // Capture photo on button click
            captureButton.addEventListener('click', () => {
                // Draw the video frame to the canvas
                const context = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Convert canvas content to base64 image and save it to the hidden input
                const photoData = canvas.toDataURL('image/png');
                photoInput.value = photoData;

                // Stop the video stream to freeze the frame
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }

                // Hide the video and show the captured photo
                video.style.display = 'none';
                canvas.style.display = 'block';

                // Show a success message
                alert('Photo captured successfully! You can now book the appointment.');
            });
        </script>



    </body>

</html>
