<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | DigiTAL</title>
    <link rel="icon" href="{% static 'img/redketchup/android-chrome-512x512.png' %}" type="image/icon type">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            padding: 0;
            margin: 0;
            border: none;
            text-decoration: none;
            font-family: "Fredoka", sans-serif;
            letter-spacing: 1px;
            text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black;
        }
        body {
            background-color: grey;
        }
        #hero {
            background-image: url('{% static "img/backgrd.svg" %}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #hero::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.1);
            z-index: 0;
        }
        .hero-section-container {
            background-color: rgba(255, 255, 255, 0.1);
            height: fit-content;
            width: 85%;
            border-radius: 30px;
            border: 2px solid rgba(211, 211, 211, 0.2);
            backdrop-filter: blur(8px);
            padding: 10px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 15px;
            margin: 10px;
            z-index: 1;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
        .logo span {
            color: rgb(0, 225, 225);
        }
        nav {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        nav a {
            color: white;
            font-size: 18px;
            font-weight: 500;
            position: relative;
        }
        nav a::after {
            content: '';
            position: absolute;
            bottom: -10px;
            height: 2px;
            width: 80%;
            box-shadow: 0 0 5px white;
            transform: scaleX(0) translateY(-100%);
            background-color: white;
            transition: 0.3s;
        }
        nav a:hover::after {
            transform: scaleX(0.5) translateY(0);
        }
        .active {
            color: rgb(0, 225, 225);
        }
        .active::after {
            background-color: rgb(0, 225, 225);
        }
        header button {
            font-size: 18px;
            font-weight: bold;
            padding: 7px 25px;
            background-color: transparent;
            border: 1px solid white;
            border-radius: 20px;
            color: white;
            transition: 0.3s;
            cursor: pointer;
        }
        header button:hover {
            background-color: rgb(0, 225, 225);
            color: rgba(0, 0, 0, 0.6);
            border-color: rgb(0, 225, 225);
        }
        .hero-content {
            padding: 15px 25px 0 25px;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
        }
        .hero-content img {
            width: 90%;
            filter: drop-shadow(0 0 5px rgb(0, 225, 225))
                drop-shadow(0 0 5px rgb(0, 225, 225))
                drop-shadow(0 0 10px rgb(0, 225, 225))
                drop-shadow(0 0 25px rgb(0, 225, 225));
        }
        .right-section {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        @keyframes rotatePlanet {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .image-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotatePlanet 200s linear infinite;
            height: 30vh;
            width: 30vw;
        }
        .image-wrap img {
            border-radius: 100px;
        }
        .left-section {
            display: flex;
            align-items: center;
            z-index: 1;
        }
        .left-section h3 {
            font-size: 4rem;
            letter-spacing: 20px;
            color: white;
        }
        .left-section h1 {
            font-size: 8rem;
            font-weight: 800;
            color: white;
            margin: -20px 0 0 0;
        }
        h1 .color-change {
            color: #BDF516;
        }
        h3 .color-change {
            color: #BDF516;
            letter-spacing: 20px;
        }
        .left-section p {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            line-height: 1.5;
            color: white;
            width: 90%;
            margin-bottom: 50px;
        }
        p span {
            color: white;
            font-weight: 900;
            font-size: 20px;
        }
        .cta-btn {
            background-color: rgb(92, 255, 255);
            color: white;
            text-transform: uppercase;
        }
        .cta-btn:hover {
            background-color: rgb(115, 255, 255);
            color: black;
            border: none;
            font-weight: normal;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        .big-cta-btn {
            font-weight: bolder;
            font-size: 20px;
            letter-spacing: 1.5px;
            width: 250px;
            height: 55px;
            border-radius: 50px;
            background-color: rgb(0, 225, 225);
            color: white;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        .big-cta-btn:hover {
            letter-spacing: 5px;
            background-color: black;
            font-weight: 500;
        }
        .social-icons {
            color: white;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .social-icons i {
            font-size: 18px;
            width: 10px;
            height: 10px;
            border: 1px solid white;
            padding: 15px;
            border-radius: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .social-icons i:hover {
            color: rgb(0, 225, 225);
            border-color: rgb(0, 225, 225);
            transform: rotate(360deg) scale(1.1);
        }
        @keyframes sideInLeft {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0%); opacity: 1; }
        }
        @keyframes sideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0%); opacity: 1; }
        }
        @keyframes topIn {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0%); opacity: 1; }
        }
        @keyframes bottomIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0%); opacity: 1; }
        }
        header {
            animation: topIn 1.2s ease-out forwards;
            opacity: 0;
            animation-delay: 0.2s;
        }
        h3 {
            animation: sideInLeft 1s ease-out forwards;
            opacity: 0;
        }
        h1 {
            animation: sideInLeft 1s ease-out forwards;
            opacity: 0;
            animation-delay: 0.4s;
        }
        p {
            animation: sideInLeft 1s ease-out forwards;
            opacity: 0;
            animation-delay: 0.6s;
        }
        .big-cta-btn {
            animation: sideInLeft 1s ease-out forwards;
            opacity: 0;
            animation-delay: 0.8s;
        }
        .social-icons {
            animation: bottomIn 1s ease-out forwards;
            opacity: 0;
            animation-delay: 0.2s;
        }
        .right-section img {
            animation: sideInRight 1s ease-out forwards;
            opacity: 0;
            animation-delay: 0.2s;
        }
    </style>
</head>
<body>
    <section id="hero">
        <div class="hero-section-container">
            <header>
                <a class="logo" href="#hero">Digi<span>TAL</span></a>
                {% if user.is_authenticated and user.role == 'admin' %}
                    <a href="{% url 'admin_dashboard' %}"><button>Admin Dashboard</button></a>
                {% endif %}
                <a href="{% url 'login' %}"><button class="cta-btn">Login</button></a>
            </header>
            <div class="hero-content">
                <div class="left-section">
                    <div class="left-content-container">
                        <h3><span class="color-change">Digi</span>tal</h3>
                        <h1><span>HOSPI<span class="color-change">TAL</span></span></h1>
                        <p><span>Transforming Healthcare, One Click at a Time.</span><br>Our digital hospital management system is designed to make healthcare accessible, efficient for everyone.</p>
                        <a href="{% url 'login' %}"><button class="big-cta-btn">Login</button></a>
                    </div>
                </div>
                <div class="right-section">
                    <div class="image-wrap">
                        <img src="{% static 'img/hos-structure.jpg' %}" alt="planet image">
                    </div>
                </div>
            </div>
            <div class="social-icons">
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-youtube"></i>
                <i class="fa-brands fa-twitter"></i>
                <i class="fa-brands fa-google"></i>
            </div>
        </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</body>
</html>
